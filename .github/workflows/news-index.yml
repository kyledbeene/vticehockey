name: Update news index

# Uploading or editing an article in news/ rebuilds news/news-index.json and adds the article to sitemap.xml.
on:
  push:
    branches: [main]
    paths:
      - 'news/*.md'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 generate-news-index.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/news-index.json sitemap.xml
          git diff --cached --quiet || (git commit -m "Update news index and sitemap" && git push)
